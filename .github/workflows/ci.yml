name: Document Core
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  source-format:
    name: Axonyx Source Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-axonyx --git https://github.com/vladanPro/axonyx-framework --rev b528d920d74db54fe3685e986953bbec9b2c93d0 --force
      - run: bash scripts/format-sources.sh --check
      - name: Check staged-source hook safety
        shell: pwsh
        run: ./scripts/test-format-hook.ps1 -FormatterPath (Get-Command cargo-ax).Source
  document-core:
    name: Document Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
  paragraph-browser:
    name: Editor Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Check out canonical Foundry editor icons
        uses: actions/checkout@v4
        with:
          repository: vladanPro/axonyx-ui
          ref: 5b2d2ecdd87f11ff9c43083cd8a14903f4b6f87d
          path: .test-ui
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/editor-test-tools" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/editor-test-tools/node_modules/.bin/playwright" install --with-deps "${{ matrix.browser }}"
      - run: node tests/browser.mjs "$RUNNER_TEMP/editor-test-tools" "${{ matrix.browser }}"
        env:
          AXONYX_UI_SOURCE: ${{ github.workspace }}/.test-ui
