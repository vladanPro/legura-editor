name: Document Core
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  document-core:
    name: Document Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
  paragraph-browser:
    name: Paragraph Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/editor-test-tools" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/editor-test-tools/node_modules/.bin/playwright" install --with-deps chromium
      - run: node tests/browser.mjs "$RUNNER_TEMP/editor-test-tools"
