name: Document Core
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  document-core:
    name: Document Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
